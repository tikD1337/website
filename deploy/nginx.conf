# Фрагмент server { … } для sysadmin.fun (срез 8А).
# root — папка, куда копируется dist/. add_header внутри location
# отменяет унаследованные, поэтому заголовки повторены в каждом.

location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
}

location /assets/ {
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, noarchive" always;
}

# Сервер контента: сценарии, оценка, курсы, интервью.
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1m;
}

# Файл заголовков Cloudflare nginx не читает — и отдавать его незачем.
location = /_headers { return 404; }
